name: Auto-reply for Service 03
on:
  issues:
    types: [labeled]

jobs:
  auto-reply:
    if: github.event.label.name == 'service:03'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Leave a comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.html_url }}
        run: |
          gh issue comment "$ISSUE" --body "Дякуємо за звернення! Нагадуємо, що лінія підтримки цього сервісу працює за оновленим графіком: з **08:00 до 23:00**. Якщо ваш запит створено поза цими годинами, ми опрацюємо його на початку робочого дня."
