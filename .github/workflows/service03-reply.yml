name: Auto-reply for Service 03
on:
  issues:
    types: [labeled]

jobs:
  auto-reply:
    if: github.event.label.name == 'service:03'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check time and leave a comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.html_url }}
          TZ: "Europe/Kyiv"
        run: |
          HOUR=$(date +%-H)
          if [ "$HOUR" -lt 8 ] || [ "$HOUR" -ge 23 ]; then
            gh issue comment "$ISSUE" --body "Дякуємо за звернення! Наразі лінія підтримки не працює (наш графік: з **08:00 до 23:00**). Ми опрацюємо ваш запит на початку робочого дня."
          else
            echo "Зараз робочий час (година: $HOUR). Автовідповідь не надсилається."
          fi
